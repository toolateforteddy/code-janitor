name: Code Janitor (Go Service)

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Code Janitor
        uses: toolateforteddy/code-janitor@main
        with:
          provider: 'google'
          model: 'gemini-3.6-flash'
          lint_command: 'golangci-lint run'
          test_command: 'go test -v -race ./...'
          exclude_paths: '.github/workflows/**, vendor/**, **/*.pb.go, **/*_gen.go'
          max_prs_per_run: 2
          draft_pr: true
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}