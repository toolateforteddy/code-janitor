name: Code Janitor (Android Kotlin)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sweep:
    uses: toolateforteddy/code-janitor/.github/workflows/code-janitor.yml@main
    with:
      provider: 'google'
      model: 'gemini-3.6-flash'
      java_version: '17'
      lint_command: './gradlew lint'
      test_command: './gradlew test'
      exclude_paths: '.github/workflows/**, build/**, **/build/**'
      draft_pr: true
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
