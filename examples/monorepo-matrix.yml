name: Code Janitor (Monorepo)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sweep-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'billing-service'
            path: 'services/billing'
            test_cmd: 'go test ./services/billing/...'
            reviewers: 'my-org/billing-devs'

          - name: 'auth-service'
            path: 'pkg/auth'
            test_cmd: 'go test ./pkg/auth/...'
            reviewers: 'my-org/security-team'

          - name: 'web-dashboard'
            path: 'apps/dashboard'
            test_cmd: 'npm test --prefix apps/dashboard'
            reviewers: 'my-org/frontend-team'

    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Code Janitor
        uses: toolateforteddy/code-janitor@main
        with:
          target_path: ${{ matrix.path }}
          test_command: ${{ matrix.test_cmd }}
          reviewers: ${{ matrix.reviewers }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}