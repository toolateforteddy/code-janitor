name: Code Janitor Self Sweep

# Code Janitor sweeps its own repository, dogfooding the action from the
# checked-out working tree (`uses: ./`) rather than a published ref, so a
# regression in the engine shows up here before anyone else consumes it.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider (google, anthropic, openai)'
        type: string
        required: false
        default: 'google'
      model:
        description: 'Model ID to execute'
        type: string
        required: false
        default: 'gemini-3.6-flash'
      janitor_mode:
        description: 'Execution mode (auto, repair-only, refactor-only)'
        type: string
        required: false
        default: 'auto'
      max_prs_per_run:
        description: 'Maximum atomic PRs to open in this run'
        type: string
        required: false
        default: '3'

jobs:
  sweep:
    name: Sweep code-janitor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Code Janitor on itself
        uses: ./
        with:
          provider: ${{ inputs.provider || 'google' }}
          model: ${{ inputs.model || 'gemini-3.6-flash' }}
          # Keep sweeping when the primary provider's allowance is spent, but only
          # when a key for the backup is actually configured.
          fallback_provider: ${{ secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || '' }}
          janitor_mode: ${{ inputs.janitor_mode || 'auto' }}
          max_prs_per_run: ${{ inputs.max_prs_per_run || '3' }}
          # The engine lives in scripts/; its tests and typecheck are what CI runs.
          install_command: 'cd scripts && npm ci'
          lint_command: 'cd scripts && npx tsc --noEmit'
          test_command: 'cd scripts && npm test'
          test_timeout: 10
          target_path: 'scripts'
          # Workflows are excluded so a sweep can never rewrite its own trigger;
          # the lockfile is generated by npm, not by hand.
          exclude_paths: '.github/workflows/**, **/node_modules/**, scripts/package-lock.json'
          draft_pr: 'true'
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
