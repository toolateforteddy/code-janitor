name: Code Janitor Engine

on:
  workflow_call:
    inputs:
      provider:
        description: 'AI Provider (google, anthropic, openai)'
        type: string
        required: false
        default: 'google'
      model:
        description: 'Model ID to execute'
        type: string
        required: false
        default: 'gemini-3.6-flash'
      fallback_provider:
        description: 'Backup AI provider used once the primary runs out of tokens/quota. Empty disables the fallback.'
        type: string
        required: false
        default: ''
      fallback_model:
        description: 'Model ID for the backup provider. Empty uses that provider default.'
        type: string
        required: false
        default: ''
      test_command:
        description: 'Command to run tests (e.g., go test ./..., cargo test, npm test)'
        type: string
        required: false
        default: 'go test ./...'
      test_timeout:
        description: 'Timeout for test execution in minutes'
        type: number
        required: false
        default: 5
      lint_command:
        description: 'Command to run linters before tests'
        type: string
        required: false
        default: ''
      install_command:
        description: 'Command to install project dependencies (e.g. npm ci, poetry install, pip install -r requirements.txt). Runs in the workspace and in any worktree still missing dependencies. If empty, Node installs are auto-detected from the lockfile.'
        type: string
        required: false
        default: ''
      install_timeout:
        description: 'Timeout for dependency installation in minutes'
        type: number
        required: false
        default: 10
      auto_install:
        description: 'Auto-detect and run a Node install command (npm ci / yarn / pnpm) when dependencies are missing and install_command is empty'
        type: boolean
        required: false
        default: true
      target_path:
        description: 'Subdirectory path to restrict diff analysis to'
        type: string
        required: false
        default: '.'
      exclude_paths:
        description: 'Comma-separated glob patterns to ignore'
        type: string
        required: false
        default: '.github/workflows/**, vendor/**, generated/**, dist/**'
      enable_test_generation:
        description: 'Whether to write unit tests for uncovered code'
        type: boolean
        required: false
        default: true
      max_prs_per_run:
        description: 'Maximum atomic PRs to open in one run'
        type: number
        required: false
        default: 3
      max_line_diff:
        description: 'Hard cap on total diff lines to non-test files per atomic PR'
        type: number
        required: false
        default: 100
      max_test_line_diff:
        description: 'Hard cap on total diff lines to test files per atomic PR (counted separately from max_line_diff)'
        type: number
        required: false
        default: 200
      enforce_line_budget:
        description: 'Reject proposals whose measured diff exceeds max_line_diff / max_test_line_diff (set false for prompt-only guidance)'
        type: boolean
        required: false
        default: true
      max_concurrency:
        description: 'Maximum number of fixes to process in parallel (via git worktrees) per run'
        type: number
        required: false
        default: 3
      reviewers:
        description: 'Comma-separated GitHub handles or teams to request review'
        type: string
        required: false
        default: ''
      draft_pr:
        description: 'Open PRs in Draft state'
        type: boolean
        required: false
        default: true
      janitor_mode:
        description: 'Execution mode (auto, repair-only, refactor-only)'
        type: string
        required: false
        default: 'auto'
      enable_llm_tools:
        description: 'Allow LLM to call workspace tools (read files, list directories, run safe commands)'
        type: boolean
        required: false
        default: true
      max_llm_tool_steps:
        description: 'Maximum tool call steps per LLM request'
        type: number
        required: false
        default: 5
      llm_max_retries:
        description: 'Retries after a transient LLM API failure (429, 5xx, dropped connection, unparseable response). 0 disables retrying.'
        type: number
        required: false
        default: 4
      llm_retry_base_delay_ms:
        description: 'Base delay in milliseconds for exponential backoff between LLM retries'
        type: number
        required: false
        default: 1000
      llm_retry_max_delay_ms:
        description: 'Maximum delay in milliseconds between LLM retries'
        type: number
        required: false
        default: 30000
      dedupe_prs:
        description: 'Skip proposals already covered by an existing (open, or closed-unmerged) Code Janitor PR'
        type: boolean
        required: false
        default: true
      go_version:
        description: 'Go version (e.g. "1.22", "oldstable", "stable"). If empty, reads from go.mod.'
        type: string
        required: false
        default: ''
      node_version:
        description: 'Node.js version (e.g. "18", "20", "22", "24"). If empty, reads from .nvmrc, .node-version, or package.json.'
        type: string
        required: false
        default: ''
      python_version:
        description: 'Python version (e.g. "3.10", "3.11", "3.12"). If empty, reads from pyproject.toml or .python-version.'
        type: string
        required: false
        default: ''
      rust_toolchain:
        description: 'Rust toolchain channel (e.g. "stable", "nightly", "1.75.0"). Defaults to "stable".'
        type: string
        required: false
        default: 'stable'
      java_version:
        description: 'Java/JDK version for Android Kotlin / Gradle (e.g. "17", "21"). Defaults to "17".'
        type: string
        required: false
        default: '17'

    secrets:
      GEMINI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Code Janitor Engine
        uses: actions/checkout@v7
        with:
          repository: 'toolateforteddy/code-janitor'
          path: '.central-janitor'

      - name: Execute Code Janitor Action
        uses: ./.central-janitor
        with:
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          fallback_provider: ${{ inputs.fallback_provider }}
          fallback_model: ${{ inputs.fallback_model }}
          test_command: ${{ inputs.test_command }}
          test_timeout: ${{ inputs.test_timeout }}
          lint_command: ${{ inputs.lint_command }}
          install_command: ${{ inputs.install_command }}
          install_timeout: ${{ inputs.install_timeout }}
          auto_install: ${{ inputs.auto_install }}
          target_path: ${{ inputs.target_path }}
          exclude_paths: ${{ inputs.exclude_paths }}
          enable_test_generation: ${{ inputs.enable_test_generation }}
          max_prs_per_run: ${{ inputs.max_prs_per_run }}
          max_line_diff: ${{ inputs.max_line_diff }}
          max_test_line_diff: ${{ inputs.max_test_line_diff }}
          enforce_line_budget: ${{ inputs.enforce_line_budget }}
          max_concurrency: ${{ inputs.max_concurrency }}
          reviewers: ${{ inputs.reviewers }}
          draft_pr: ${{ inputs.draft_pr }}
          janitor_mode: ${{ inputs.janitor_mode }}
          enable_llm_tools: ${{ inputs.enable_llm_tools }}
          max_llm_tool_steps: ${{ inputs.max_llm_tool_steps }}
          llm_max_retries: ${{ inputs.llm_max_retries }}
          llm_retry_base_delay_ms: ${{ inputs.llm_retry_base_delay_ms }}
          llm_retry_max_delay_ms: ${{ inputs.llm_retry_max_delay_ms }}
          dedupe_prs: ${{ inputs.dedupe_prs }}
          go_version: ${{ inputs.go_version }}
          node_version: ${{ inputs.node_version }}
          python_version: ${{ inputs.python_version }}
          rust_toolchain: ${{ inputs.rust_toolchain }}
          java_version: ${{ inputs.java_version }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}